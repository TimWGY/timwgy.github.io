<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tim Guangyu WU - Urban Planning Researcher</title>
    <style>
        /* Modern, clean font stack */
        :root {
            --bg-color: #fdfdfd;
            --text-main: #222222;
            --text-muted: #666666;
            --nyu-violet: #57068c; 
            --border-color: #eaeaea;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            line-height: 1.6;
            padding: 2rem;
        }

        /* Container with a subtle fade-in effect */
        .container {
            max-width: 600px;
            animation: fadeIn 1.2s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .affiliation {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            font-weight: 400;
        }

        /* Subtle nod to your university colors */
        .nyu {
            color: var(--nyu-violet);
            font-weight: 500;
        }

        .research {
            font-size: 1.25rem;
            font-weight: 300;
            margin-bottom: 3rem;
            color: var(--text-main);
        }

        .coming-soon {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
            display: inline-block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tim Guangyu WU</h1>
        
        <div class="affiliation">
            PhD Candidate at <span class="nyu">NYU Wagner</span> & <span class="nyu">NYU Shanghai</span>
        </div>
        
        <div class="research">
            Designing Cities for Vibrant, Flourishing Lives
        </div>
        
        <div class="coming-soon">
            A newer version of this website is coming soon.
        </div>
    </div>
</body>
</html>
