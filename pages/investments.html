<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>资本涌入与企业演进时空图</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root { --bg: #05080a; --panel: rgba(13, 17, 23, 0.95); --accent: #5470c6; --text: #e6edf3; --grey: #8b949e; --border: #30363d;}
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); font-family: -apple-system, sans-serif; color: var(--text); overflow: hidden; }
        #main { width: 100vw; height: 100vh; }
        
        /* 弹窗档案区 */
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1999; backdrop-filter: blur(5px); }
        #modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 950px; height: 700px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; z-index: 2000; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        
        .modal-left { width: 50%; padding: 25px; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .modal-right { width: 50%; padding: 25px; display: flex; flex-direction: column; overflow-y: auto;}
        
        .m-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .m-title { font-size: 26px; font-weight: bold; color: #fff; margin-bottom: 5px; }
        .m-badge { background: rgba(84, 112, 198, 0.15); color: #73c0de; padding: 4px 10px; border-radius: 4px; font-size: 12px; border: 1px solid rgba(84,112,198,0.3); display: inline-block; }
        .m-close { cursor: pointer; color: var(--grey); font-size: 24px; font-weight: bold; position: absolute; right: 20px; top: 15px; z-index: 10;}
        .m-close:hover { color: #fff; }
        
        /* 时间轴与弹窗内折线图样式 */
        #modal-line-chart { width: 100%; height: 180px; margin-top: 10px; margin-bottom: 10px; }
        .timeline { flex: 1; overflow-y: auto; padding-right: 10px; margin-top: 10px; }
        .history-item { padding: 12px; border-left: 2px solid var(--border); position: relative; margin-bottom: 15px; background: rgba(255,255,255,0.02); border-radius: 0 6px 6px 0; transition: 0.2s; }
        .h-round { font-weight: bold; color: #fff; font-size: 16px;}
        .h-date { color: var(--grey); font-size: 12px; margin-left: 10px;}
        .h-amount { color: #ffffff; font-size: 18px; font-weight: bold; margin: 5px 0; }
        .h-investors { font-size: 13px; color: #b1bac4; line-height: 1.5; }
        
        /* 雷达与标签区 */
        #radar-chart { width: 100%; height: 300px; }
        .tags-container { margin-top: 10px; font-size: 13px; }
        .tag-group { margin-bottom: 10px; }
        .tag-badge { display: inline-block; padding: 2px 8px; border: 1px solid; border-radius: 12px; font-size: 12px; margin: 2px; background: rgba(255,255,255,0.05); }

        /* 滚动条美化 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #5470c6; }
    </style>
</head>
<body>

    <div id="main"></div>

    <div id="overlay" onclick="closeModal()"></div>
    <div id="modal">
        <div class="m-close" onclick="closeModal()">✕</div>
        <div class="modal-left">
            <div>
                <div class="m-title" id="m-name">-</div>
                <div class="m-badge" id="m-stage">-</div>
                <div style="font-size: 12px; color: var(--grey); margin-top: 8px;" id="m-desc"></div>
            </div>
            
            <h4 style="margin: 15px 0 0 0; border-bottom: 1px solid var(--border); padding-bottom: 5px; color: #fff;">历年累计融资金额趋势</h4>
            <div id="modal-line-chart"></div>

            <h4 style="margin: 5px 0 5px 0; border-bottom: 1px solid var(--border); padding-bottom: 5px; color: #fff;">详细融资时间线</h4>
            <div class="timeline" id="m-timeline"></div>
        </div>
        <div class="modal-right">
            <h4 style="margin: 0; text-align: center; color: #fff;">核心维系雷达图</h4>
            <div id="radar-chart"></div>
            <div class="tags-container" id="m-tags"></div>
        </div>
    </div>

<script>
    let db = { base: {}, tags: {}, events: [] };
    let myChart = null;
    let radarChart = null;
    let modalLineChart = null;

    // ================= 数据处理 =================
    function processBase(data) {
        data.forEach(row => {
            let name = row['公司简称'] || row['公司名称'];
            if(name) db.base[name.trim()] = row;
        });
    }

    function processTags(data) {
        data.forEach(row => {
            let name = row['公司名称'];
            if(!name) return;
            const splitTags = (str) => str ? str.split(',').map(s=>s.trim()).filter(s=>s) : [];
            db.tags[name.trim()] = { 
                tagsA: splitTags(row['维度A_核心技术（Core Tech）']), 
                tagsB: splitTags(row['维度B_下游场景（Vertical Application）']), 
                tagsC: splitTags(row['维度C_资本梯队&信用背书（Capital Tier & Credibility）']), 
                tagsD: splitTags(row['维度D_政策导向&组织韧性（Policy Compliance & Resilience）'])
            };
        });
    }

    function processEvents(data) {
        data.forEach(row => {
            let name = row['公司名称'];
            if(!name) return;
            name = name.trim();
            let dateStr = row['融资时间'] || row['date'] || '';
            let yearMatch = dateStr.match(/\d{4}/);
            if(!yearMatch) return; 
            
            let year = parseInt(yearMatch[0]);
            let monthMatch = dateStr.match(/\d{4}[\/-](\d{1,2})/);
            let month = monthMatch ? parseInt(monthMatch[1]) : 6;
            
            // 同步修复：12月份时间黑洞 Bug
            let exactYear = year + ((month - 1) / 12); 

            // 同步修复：增强对千位符和人民币符号的过滤
            let amountStr = '';
            for (let key in row) {
                let k = key.trim().toLowerCase();
                if (k.includes('金额') || k === 'amount') {
                    amountStr = row[key];
                    break;
                }
            }
            let amount = parseFloat(amountStr.toString().replace(/,/g, '').replace(/¥/g, '').trim()) || 0;
            
            db.events.push({
                name: name,
                exactYear: exactYear,
                displayDate: dateStr,
                amount: amount,
                note: row['备注'] || row['note'] || '',
                round: row['round'] || row['轮次'] || '未知轮次',
                investors: row['investors'] || row['投资方'] || '未透露'
            });
        });
    }

    // ================= 构建 ECharts 可视化 =================
    function buildVisualization() {
        myChart = echarts.init(document.getElementById('main'));

        let seriesMap = {
            '已上市企业': { color: '#f2a154', data: [] }, 
            '新三板企业': { color: '#b0c7a9', data: [] }, 
            '已被收购': { color: '#fb7185', data: [] },   
            '已退市': { color: '#8b949e', data: [] },     
            '常规融资事件': { color: '#38bdf8', data: [] } 
        };

        db.events.forEach(ev => {
            let baseInfo = db.base[ev.name] || {};
            let statusAttr = (baseInfo['上市属性'] || '') + " " + (baseInfo['融资阶段'] || '');
            
            let seriesName = '常规融资事件';
            if (statusAttr.includes('已上市')) seriesName = '已上市企业';
            else if (statusAttr.includes('已退市')) seriesName = '已退市';
            else if (statusAttr.includes('新三板') || statusAttr.includes('场外')) seriesName = '新三板企业';
            else if (statusAttr.includes('已被收购') || statusAttr.includes('并购')) seriesName = '已被收购';
            
            let color = seriesMap[seriesName].color;

            let yVal = ev.amount > 0 ? ev.amount : 1; 
            yVal = yVal * (1 + (Math.random() - 0.5) * 0.25); 
            if(yVal < 1) yVal = 1;

            let dataPoint = {
                name: ev.name,
                value: [ev.exactYear, yVal, ev.amount, ev, color, seriesName],
                itemStyle: { color: color, opacity: 0.85, borderColor: '#fff', borderWidth: 0.5 }
            };

            seriesMap[seriesName].data.push(dataPoint);
        });

        let yearlyStats = {};
        for(let y = 2010; y <= 2025; y++) yearlyStats[y] = { totalAmount: 0, companies: new Set() };
        db.events.forEach(ev => {
            let y = Math.floor(ev.exactYear);
            if(y >= 2010 && y <= 2025) {
                yearlyStats[y].totalAmount += ev.amount;
                yearlyStats[y].companies.add(ev.name);
            }
        });
        
        let lineDataAmount = []; 
        let lineDataCount = [];
        let lineDataCumAmount = []; 
        let cumulativeTotal = 0;    

        for(let y = 2010; y <= 2025; y++) {
            let currentYearAmount = yearlyStats[y].totalAmount;
            
            lineDataAmount.push([y, currentYearAmount]);
            lineDataCount.push([y, yearlyStats[y].companies.size]);
            
            cumulativeTotal += currentYearAmount;
            lineDataCumAmount.push([y, cumulativeTotal]); 
        }

        let seriesConfig = [];
        for (let sName in seriesMap) {
            seriesConfig.push({
                type: 'scatter',
                name: sName,
                yAxisIndex: 0,
                data: seriesMap[sName].data,
                itemStyle: { color: seriesMap[sName].color }, 
                symbolSize: function (val) {
                    let amt = val[2];
                    if(amt === 0) return 8; 
                    return Math.max(10, Math.min(35, Math.pow(amt, 0.4) * 0.8)); 
                },
                zlevel: 1
            });
        }
        
        seriesConfig.push({
            type: 'line', name: '该年总融资金额', yAxisIndex: 1, data: lineDataAmount,
            symbol: 'circle', symbolSize: 10, itemStyle: { color: '#91cc75' },
            lineStyle: { width: 3, shadowColor: 'rgba(145,204,117,0.5)', shadowBlur: 8 }, smooth: true, zlevel: 3
        });
        seriesConfig.push({
            type: 'line', name: '年度融资企业数', yAxisIndex: 2, data: lineDataCount,
            symbol: 'rect', symbolSize: 10, itemStyle: { color: '#fc8452' },
            lineStyle: { width: 3, type: 'dashed', shadowColor: 'rgba(252,132,82,0.5)', shadowBlur: 8 }, smooth: true, zlevel: 3
        });
        seriesConfig.push({
            type: 'line', name: '年度累计总融资金额', yAxisIndex: 1, data: lineDataCumAmount,
            symbol: 'triangle', symbolSize: 10, itemStyle: { color: '#5470c6' },
            lineStyle: { width: 3, shadowColor: 'rgba(84,112,198,0.5)', shadowBlur: 8 }, smooth: true, zlevel: 3
        });

        let option = {
            backgroundColor: 'transparent',
            title: { text: '具身智能：资本爆发与企业演进时空图', left: 20, top: 20, textStyle: { color: '#fff', fontSize: 20 } },
            
            legend: [
                { 
                    data: ['该年总融资金额', '年度累计总融资金额', '年度融资企业数'], 
                    top: 20, right: 100, textStyle: { color: '#fff', fontSize: 14 } 
                },
                { 
                    data: ['已上市企业', '新三板企业', '已被收购', '已退市', '常规融资事件'], 
                    top: 60, left: 180, orient: 'horizontal', 
                    textStyle: { color: '#fff', fontSize: 13 },
                    backgroundColor: 'rgba(13,17,23,0.8)', borderColor: '#30363d', borderWidth: 1, padding: 10, borderRadius: 8,
                    itemGap: 15
                }
            ],

            tooltip: {
                backgroundColor: 'rgba(13, 17, 23, 0.95)', borderColor: '#30363d', textStyle: { color: '#fff' },
                formatter: function (p) {
                    if (p.seriesType === 'line') {
                        let yVal = (p.seriesName === '年度融资企业数') ? p.data[1] + ' 家' : (p.data[1] >= 10000 ? (p.data[1]/10000).toFixed(2)+' 亿元' : p.data[1].toFixed(0)+' 万元');
                        return `<b style="font-size:16px">${p.data[0]} 年</b><br/>
                                <span style="color:${p.color}">●</span> ${p.seriesName}: <b style="font-size:15px">${yVal}</b>`;
                    }
                    if(p.seriesType === 'scatter') {
                        let d = p.data.value[3];
                        let baseInfo = db.base[d.name] || {};
                        let cStatus = baseInfo['上市属性'] || baseInfo['融资阶段'] || '未披露';
                        return `<b style="font-size:16px">${d.name}</b> <span style="font-size:12px; color:#8b949e">[${cStatus}]</span><br>
                                时间: ${d.displayDate}<br>
                                轮次: <span style="color:${p.data.value[4]}">${d.round}</span><br>
                                金额: <span style="font-weight:bold">${d.amount > 0 ? d.amount + ' 万元' : '金额未披露'}</span><br>
                                资方: ${d.investors}`;
                    }
                    return '';
                }
            },
            grid: { left: 80, right: 160, top: 120, bottom: 50 },
            xAxis: {
                type: 'value', min: 2010, max: 2025, 
                splitLine: { show: true, lineStyle: { color: '#161b22', type: 'dashed' } },
                axisLabel: { color: '#8b949e', formatter: '{value} 年', fontSize: 14 }
            },
            yAxis: [
                {
                    type: 'log', min: 1, 
                    name: '单笔金额 (对数)', nameLocation: 'end',
                    nameTextStyle: { color: '#8b949e', align: 'left', padding: [0, 0, 10, 20] },
                    splitLine: { show: true, lineStyle: { color: '#161b22' } },
                    axisLabel: { color: '#8b949e', fontSize: 12, formatter: function(v) { if (v <= 2) return '未披露'; if (v >= 10000) return (v / 10000) + ' 亿'; return v + ' 万'; } }
                },
                {
                    type: 'value', name: '融资金额统计', position: 'right', nameTextStyle: { color: '#fff', fontSize: 13, padding: [0, 0, 0, 40] },
                    splitLine: { show: false }, axisLine: { show: true, lineStyle: { color: '#fff' } },
                    axisLabel: { color: '#fff', formatter: function(v) { return v >= 10000 ? (v/10000)+' 亿' : v+' 万'; } }
                },
                {
                    type: 'value', name: '融资企业数', position: 'right', offset: 80, nameTextStyle: { color: '#fc8452', fontSize: 13, padding: [0, 0, 0, 30] },
                    splitLine: { show: false }, axisLine: { show: true, lineStyle: { color: '#fc8452' } },
                    axisLabel: { color: '#fc8452', formatter: '{value} 家' }
                }
            ],
            series: seriesConfig
        };
        myChart.setOption(option);

        myChart.on('click', function(params) {
            if(params.seriesType === 'scatter') openModal(params.data.name);
        });
        window.addEventListener('resize', () => myChart.resize());
    }

    // ================= 弹窗与微观档案 =================
    function openModal(companyName) {
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('modal').style.display = 'flex'; 
        
        let baseInfo = db.base[companyName] || {};
        let tagInfo = db.tags[companyName] || { tagsA:[], tagsB:[], tagsC:[], tagsD:[] };
        
        let chronoHist = db.events.filter(e => e.name === companyName).sort((a,b) => a.exactYear - b.exactYear); 
        let histDesc = [...chronoHist].reverse(); 
        
        document.getElementById('m-name').innerText = companyName;
        document.getElementById('m-stage').innerText = (baseInfo['上市属性'] || baseInfo['融资阶段'] || '未披露');
        document.getElementById('m-desc').innerText = baseInfo['description'] ? (baseInfo['description'].substring(0, 180) + '...') : '暂无企业简介信息';
        
        let tlHtml = '';
        histDesc.forEach(h => {
            let amtStr = h.amount > 0 ? `¥ ${(h.amount/10000).toFixed(2)} 亿元` : '金额未透露';
            let noteStr = "";
            let extraStyle = "";
            let indicatorColor = "var(--accent)";

            if (h.note && h.note.includes("估算")) {
                noteStr = " <span style='font-size:12px; font-weight:normal; color:#8b949e;'>(金额估算)</span>";
                extraStyle = "border: 1px dashed #a16b47; border-left: 3px solid #a16b47; background: rgba(161, 107, 71, 0.05);";
                indicatorColor = "#a16b47"; 
            } else if (h.note && h.note.includes("缺失")) {
                noteStr = " <span style='font-size:12px; font-weight:normal; color:#8b949e;'>(金额缺失)</span>";
                extraStyle = "border: 1px dashed #909399; border-left: 3px solid #909399; background: rgba(144, 147, 153, 0.08);";
                indicatorColor = "#909399"; 
            }

            tlHtml += `
                <div class="history-item" style="${extraStyle}">
                    <div style="position: absolute; left: -7px; top: 15px; width: 10px; height: 10px; border-radius: 50%; background: ${indicatorColor};"></div>
                    <div><span class="h-round">${h.round}</span><span class="h-date">${h.displayDate}</span></div>
                    <div class="h-amount">${amtStr}${noteStr}</div>
                    <div class="h-investors">机构: ${h.investors}</div>
                </div>`;
        });
        document.getElementById('m-timeline').innerHTML = tlHtml || '<div style="color:#8b949e">暂无融资明细记录</div>';

        renderModalLineChart(chronoHist);
        renderRadar(companyName, tagInfo);
        renderTagsUI(tagInfo);
    }

    function renderModalLineChart(chronoHist) {
        if(!modalLineChart) modalLineChart = echarts.init(document.getElementById('modal-line-chart'));
        
        let yearlyData = {};
        chronoHist.forEach(e => {
            let y = Math.floor(e.exactYear);
            if(!yearlyData[y]) yearlyData[y] = 0;
            yearlyData[y] += e.amount;
        });

        let startYear = chronoHist.length > 0 ? Math.floor(chronoHist[0].exactYear) : 2010;
        let endYear = 2025; 
        let cumAmount = 0;
        let cumLineData = [];
        
        for(let y = startYear; y <= endYear; y++) {
            if(yearlyData[y]) cumAmount += yearlyData[y];
            cumLineData.push([y.toString(), cumAmount]);
        }

        let option = {
            grid: { left: 60, right: 20, top: 20, bottom: 20 },
            tooltip: {
                trigger: 'axis',
                backgroundColor: 'rgba(13, 17, 23, 0.95)', borderColor: '#30363d', textStyle: { color: '#fff' },
                formatter: function(p) {
                    let val = p[0].value[1];
                    let valStr = val >= 10000 ? (val/10000).toFixed(2) + ' 亿元' : val + ' 万元';
                    return `${p[0].axisValue}年 累计获得融资: <br/><b style="color:#5470c6; font-size:16px;">${valStr}</b>`;
                }
            },
            xAxis: { 
                type: 'category', boundaryGap: false, 
                axisLabel: { color: '#8b949e', fontSize: 11 }, 
                splitLine: { show: false } 
            },
            yAxis: {
                type: 'value', 
                splitLine: { show: true, lineStyle: { color: '#30363d', type: 'dashed' } },
                axisLabel: { color: '#8b949e', fontSize: 11, formatter: v => v >= 10000 ? (v/10000)+'亿' : v+'万' }
            },
            series: [{
                type: 'line', data: cumLineData, smooth: true, symbol: 'circle', symbolSize: 6,
                itemStyle: { color: '#5470c6' }, 
                areaStyle: { 
                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                        {offset: 0, color: 'rgba(84, 112, 198, 0.4)'}, 
                        {offset: 1, color: 'rgba(84, 112, 198, 0.0)'}
                    ]) 
                }
            }]
        };
        modalLineChart.setOption(option);
        setTimeout(() => modalLineChart.resize(), 100);
    }

    function renderRadar(name, tagInfo) {
        if(!radarChart) radarChart = echarts.init(document.getElementById('radar-chart'));
        const calcScore = (arr) => Math.min(5, arr.length > 0 ? arr.length + 2 : 1);
        let data = [calcScore(tagInfo.tagsA), calcScore(tagInfo.tagsB), calcScore(tagInfo.tagsC), calcScore(tagInfo.tagsD)];
        
        let option = {
            backgroundColor: 'transparent',
            radar: {
                indicator: [ { name: '核心技术 (A)', max: 5 }, { name: '下游场景 (B)', max: 5 }, { name: '资本背书 (C)', max: 5 }, { name: '政策韧性 (D)', max: 5 } ],
                splitArea: { areaStyle: { color: ['rgba(84, 112, 198, 0.05)', 'rgba(84, 112, 198, 0.1)'] } },
                axisLine: { lineStyle: { color: 'rgba(255, 255, 255, 0.2)' } },
                splitLine: { lineStyle: { color: 'rgba(255, 255, 255, 0.2)' } }
            },
            series: [{ type: 'radar', data: [{ value: data, name: name, areaStyle: { color: 'rgba(84, 112, 198, 0.4)' }, lineStyle: { color: '#5470c6' }, itemStyle: { color: '#5470c6' } }] }]
        };
        radarChart.setOption(option);
    }

    function renderTagsUI(tagInfo) {
        const build = (title, tags, color) => {
            if(!tags || tags.length===0) return '';
            return `<div class="tag-group">
                        <div style="color:#fff; margin-bottom:5px;">${title}</div>
                        ${tags.map(t => `<span class="tag-badge" style="border-color:${color}; color:${color}">${t}</span>`).join('')}
                    </div>`;
        };
        document.getElementById('m-tags').innerHTML = 
            build('维度A：核心技术', tagInfo.tagsA, '#ee6666') +
            build('维度B：下游场景', tagInfo.tagsB, '#73c0de') +
            build('维度C：资本/信用', tagInfo.tagsC, '#f2a154') +
            build('维度D：政策韧性', tagInfo.tagsD, '#9a60b4');
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
        document.getElementById('overlay').style.display = 'none';
    }


    // ==========================================
    // ⬇️ 【这里是供你粘贴内置数据的地方】 ⬇️
